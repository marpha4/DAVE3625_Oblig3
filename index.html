<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Husholdningen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%230d6efd'%3E%3Cpath d='M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-semibold d-flex align-items-center gap-2">
        <i class="bi bi-house-door-fill text-primary fs-4"></i>
        Husholdningen
      </span>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light border header-btn" type="button"
                data-bs-toggle="modal" data-bs-target="#memberModal">
          <i class="bi bi-people"></i>
          <span class="d-none d-sm-inline">Medlemmer</span>
        </button>

        <div class="dropdown">
          <button class="btn btn-light border header-btn dropdown-toggle" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <span id="profileAvatar" class="avatar">?</span>
            <span id="profileName" class="d-none d-sm-inline">Ingen profil</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><h6 class="dropdown-header">Bytt profil</h6></li>
            <li id="profileListAnchor" hidden></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 720px;">
    <h2 id="welcomeText" class="h4 mb-4">Velkommen</h2>

    <!-- Handleliste -->
    <section class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="bi bi-cart3 fs-5 text-primary"></i>
          <h3 class="h5 mb-0 flex-grow-1">Handleliste</h3>
          <span id="shoppingCount" class="badge rounded-pill text-bg-secondary">0</span>
        </div>

        <form id="shoppingForm" class="row g-2 align-items-end mb-3">
          <div class="col-12 col-md">
            <label for="itemInput" class="form-label small fw-semibold mb-1">Vare</label>
            <input type="text" id="itemInput" class="form-control" placeholder="Hva er tomt? F.eks. melk" maxlength="50" required>
          </div>
          <div class="col-3 col-md-2">
            <label for="quantityInput" class="form-label small fw-semibold mb-1">Antall</label>
            <input type="number" id="quantityInput" class="form-control" value="1" min="1" max="99" required>
          </div>
          <div class="col col-md-3">
            <label for="categoryInput" class="form-label small fw-semibold mb-1">Kategori</label>
            <select id="categoryInput" class="form-select"></select>
          </div>
          <div class="col-12 order-last">
            <label for="commentInput" class="form-label small fw-semibold mb-1">Kommentar <span class="fw-normal text-muted">(valgfritt)</span></label>
            <input type="text" id="commentInput" class="form-control" placeholder="F.eks. haster, trengs til fredag" maxlength="80">
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary text-nowrap" aria-label="Legg til vare">
              <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline"> Legg til</span>
            </button>
          </div>
        </form>
        <p id="shoppingNoMember" class="text-muted small" hidden>Legg til et medlem først for å bruke handlelisten.</p>

        <div id="shoppingList"></div>
        <p id="shoppingEmpty" class="text-muted text-center my-3">Handlelisten er tom.</p>

        <div class="text-end mt-3">
          <button id="clearCheckedBtn" type="button" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-trash"></i> Fjern avkryssede
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Medlemsvindu -->
  <div class="modal fade" id="memberModal" tabindex="-1" aria-labelledby="memberModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="memberModalLabel">Medlemmer</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Lukk"></button>
        </div>
        <div class="modal-body">
          <ul id="memberList" class="list-group mb-3"></ul>
          <p id="emptyText" class="text-muted">Ingen medlemmer ennå. Legg til den første under.</p>

          <form id="memberForm" class="d-flex gap-2 align-items-end">
            <div class="flex-grow-1">
              <label for="nameInput" class="form-label small fw-semibold mb-1">Navn</label>
              <input type="text" id="nameInput" class="form-control" placeholder="F.eks. Kari" maxlength="30" required>
            </div>
            <div>
              <label for="colorInput" class="form-label small fw-semibold mb-1">Farge</label>
              <input type="color" id="colorInput" class="form-control form-control-color" value="#0d6efd">
            </div>
            <button type="submit" class="btn btn-primary text-nowrap">
              <i class="bi bi-plus-lg"></i> Legg til
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Vindu for å endre en vare -->
  <div class="modal fade" id="editItemModal" tabindex="-1" aria-labelledby="editItemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="editItemForm" class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="editItemModalLabel">Endre vare</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Lukk"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="editName" class="form-label small fw-semibold mb-1">Vare</label>
            <input type="text" id="editName" class="form-control" maxlength="50" required>
          </div>
          <div class="row g-2">
            <div class="col-4">
              <label for="editQuantity" class="form-label small fw-semibold mb-1">Antall</label>
              <input type="number" id="editQuantity" class="form-control" min="1" max="99" required>
            </div>
            <div class="col-8">
              <label for="editCategory" class="form-label small fw-semibold mb-1">Kategori</label>
              <select id="editCategory" class="form-select"></select>
            </div>
          </div>
          <div class="mt-3">
            <label for="editComment" class="form-label small fw-semibold mb-1">Kommentar <span class="fw-normal text-muted">(valgfritt)</span></label>
            <input type="text" id="editComment" class="form-control" placeholder="F.eks. haster, trengs til fredag" maxlength="80">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Avbryt</button>
          <button type="submit" class="btn btn-primary">Lagre endringer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bekreftelse før sletting -->
  <div class="modal fade confirm-modal" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
          <h2 class="h5 mt-2" id="confirmModalLabel">Er du sikker?</h2>
          <p id="confirmMessage" class="text-muted mb-0"></p>
        </div>
        <div class="modal-footer justify-content-center border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Avbryt</button>
          <button type="button" id="confirmOk" class="btn btn-danger">Slett</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
